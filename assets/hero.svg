<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ink field for the Smart City Thailand monitor</title>
  <desc id="heroDesc">Original illustration. A paper field with brush marks, empty space, and a flat colour rail. Not a map, not a reading, and not a character.</desc>
  <style>
    svg { color-scheme: light dark; }
    .grain-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #101010; }
      .ink { fill: #f7f5ef; }
      .ink-stroke { stroke: #f7f5ef; }
      .grain-light { display: none; }
      .grain-dark { display: block; }
    }
  </style>
  <defs>
    <filter id="washi-light" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.06  0 0 0 0 0.045  0 0 0 0.28 0"/>
    </filter>
    <filter id="washi-dark" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0.14 0"/>
    </filter>
    <filter id="dry" x="-8%" y="-25%" width="116%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.25" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="sealCut" maskUnits="userSpaceOnUse" x="64" y="72" width="78" height="78">
      <rect x="64" y="72" width="78" height="78" fill="#ffffff"/>
      <circle cx="103" cy="118" r="11" fill="#000000"/>
      <rect x="99" y="92" width="7" height="44" fill="#000000"/>
    </mask>
  </defs>

  <rect class="paper" width="1280" height="640" fill="#f7f5ef"/>
  <rect class="grain-light" x="0" y="0" width="791" height="640" filter="url(#washi-light)"/>
  <rect class="grain-dark" x="0" y="0" width="791" height="640" filter="url(#washi-dark)"/>

  <g filter="url(#dry)">
    <path class="ink" fill="#101010" fill-opacity="0.09" d="M430 292C498 168 586 124 662 198C724 256 770 176 791 214L791 352C706 304 612 372 520 338C468 318 442 326 430 292Z"/>
    <path class="ink" fill="#101010" d="M36 470C92 446 128 498 206 474C286 448 312 424 392 452C470 480 508 428 592 454C674 480 712 436 768 460L754 482C702 458 656 506 574 478C494 450 462 512 378 478C298 446 246 478 168 498C104 514 62 486 36 490Z"/>
    <path class="ink" fill="#101010" fill-opacity="0.72" d="M418 508C470 496 512 522 566 508C624 492 668 470 724 488L716 500C662 484 620 508 566 520C510 532 468 512 418 520Z"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="7" stroke-linecap="round" d="M492 352C548 338 590 366 648 348"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="3" stroke-linecap="round" opacity="0.55" d="M548 334C582 326 604 340 636 330"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" opacity="0.4" d="M668 338C692 332 710 344 734 336"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="1.6" stroke-linecap="round" opacity="0.45" d="M118 36L112 168"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" opacity="0.75" d="M156 78L148 214"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="1.1" stroke-linecap="round" opacity="0.35" d="M198 28L194 112"/>
    <path class="ink-stroke" fill="none" stroke="#101010" stroke-width="1.3" stroke-linecap="round" opacity="0.3" d="M436 48L430 132"/>
    <ellipse class="ink" fill="#101010" cx="214" cy="456" rx="7" ry="3.2" transform="rotate(-8 214 456)"/>
    <ellipse class="ink" fill="#101010" cx="248" cy="448" rx="3" ry="1.6"/>
  </g>

  <rect class="seal" fill="#a72144" x="64" y="72" width="78" height="78" mask="url(#sealCut)"/>

  <rect fill="#12354e" x="791" y="0" width="489" height="640"/>
  <rect fill="#f99d1b" x="791" y="0" width="489" height="14"/>

  <g fill="#f7f5ef" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">
    <text x="828" y="64" font-size="13" letter-spacing="0.14em">PLATE 002</text>
    <text x="828" y="86" font-size="13" fill="#f99d1b" letter-spacing="0.08em">DIGITAL CONVERSION</text>
    <text x="828" y="560" font-size="13">#F7F5EF  PAPER</text>
    <text x="828" y="582" font-size="13">#101010  INK</text>
    <text x="828" y="604" font-size="13">#12354E  TYRIAN BLUE</text>
    <text x="1048" y="560" font-size="13">#A72144  CARMINE</text>
    <text x="1048" y="582" font-size="13">#F99D1B  YELLOW ORANGE</text>
    <text x="1048" y="604" font-size="13">61.8 / 38.2</text>
  </g>
  <text x="828" y="168" fill="#f7f5ef" font-family="'Archivo Narrow', 'Arial Narrow', Impact, sans-serif" font-size="86" font-weight="700" letter-spacing="-0.04em">THAILAND</text>
  <text x="828" y="214" fill="#f7f5ef" font-family="'Archivo Narrow', 'Arial Narrow', Arial, sans-serif" font-size="28" letter-spacing="0.12em">MONITOR</text>
  <text x="828" y="268" fill="#f7f5ef" font-family="Georgia, 'Times New Roman', serif" font-size="20">An ink field. Not a gauge.</text>
</svg>
