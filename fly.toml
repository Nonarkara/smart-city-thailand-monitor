# Fly.io — API server deployment
# Deploy: fly launch --name mtt-dashboard-api
# Then: fly deploy

app = "mtt-dashboard-api"
primary_region = "sin"  # Singapore — closest to Thailand

[build]
  [build.args]
    NODE_VERSION = "20"

[env]
  PORT = "4000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  ALLOW_LIVE_FETCH = "true"
  SYNC_INTERVAL_MS = "300000"
  VITE_DEFAULT_CITY = "muang-thong-thani"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
