name: Feature request
description: A change to sources, map layers, or the dashboard that this repo should grow on purpose.
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which existing module it would extend. Name the upstream and its terms if a new feed is involved.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: Any new number on screen comes from a named source, or is clearly seed or synthetic.
          required: true
