services:
  - type: web
    name: smart-city-thailand-monitor-web
    runtime: static
    buildCommand: set -e && npm ci && npm run build -w packages/shared && npm run build -w apps/web && ls -la apps/web/dist/assets/
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://smart-city-monitor-api.onrender.com
      - key: VITE_DEFAULT_CITY
        value: bangkok
      - key: VITE_DEFAULT_VIEW
        value: national
      - key: VITE_SITE_TITLE
        value: "Smart City Thailand Super Dashboard"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: smart-city-monitor-web
    runtime: static
    buildCommand: set -e && npm ci && npm run build -w packages/shared && npm run build -w apps/web && ls -la apps/web/dist/assets/
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://smart-city-monitor-api.onrender.com
      - key: VITE_DEFAULT_CITY
        value: bangkok
      - key: VITE_DEFAULT_VIEW
        value: national
      - key: VITE_SITE_TITLE
        value: "Smart City Thailand Super Dashboard"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: smart-city-monitor-api
    runtime: node
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALLOW_LIVE_FETCH
        value: "true"
      - key: SYNC_INTERVAL_MS
        value: "180000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
